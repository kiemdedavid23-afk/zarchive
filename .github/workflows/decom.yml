name: Décompiler une application Android

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Lien direct de l'APK dans la release"
        required: true
        type: string
      app_name:
        description: "Nom du dossier de sortie"
        required: true
        type: string
        default: "application-decompilee"
      commit_message:
        description: "Message du commit"
        required: false
        type: string
        default: "Ajout de la décompilation de l'application"

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Télécharger l'APK depuis la release
        run: |
          mkdir -p apk
          curl -L --fail --retry 3 \
            -o "apk/application.apk" \
            "${{ github.event.inputs.apk_url }}"

          ls -lh apk/application.apk
          file apk/application.apk

      - name: Installer JADX et APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip curl

          mkdir -p /opt/jadx
          curl -L --fail --retry 3 \
            -o /tmp/jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip"

          unzip -q /tmp/jadx.zip -d /opt/jadx
          chmod +x /opt/jadx/bin/jadx
          echo "/opt/jadx/bin" >> "$GITHUB_PATH"

          jadx --version
          apktool --version

      - name: Décompiler le code Java avec JADX
        run: |
          APP="${{ github.event.inputs.app_name }}"
          mkdir -p "decompiled/${APP}/jadx"

          jadx \
            --deobf \
            --show-bad-code \
            -j 4 \
            -d "decompiled/${APP}/jadx" \
            "apk/application.apk" || echo "JADX a terminé avec des avertissements."

      - name: Décompiler les ressources avec APKTool
        run: |
          APP="${{ github.event.inputs.app_name }}"
          mkdir -p "decompiled/${APP}/apktool"

          apktool d \
            -f \
            -o "decompiled/${APP}/apktool" \
            "apk/application.apk" || echo "APKTool a terminé avec des avertissements."

      - name: Committer et pousser les fichiers décompilés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add decompiled/

          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
            exit 0
          fi

          git commit -m "${{ github.event.inputs.commit_message }}"
          git push